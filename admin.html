<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DJ Deepak Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial;padding:18px}.wrap{max-width:900px;margin:auto}.box{background:#111;border:1px solid #292929;border-radius:12px;padding:18px;margin:14px 0}.title{color:#e50914;font-weight:900;letter-spacing:2px}h1,h2{margin-top:5px}input,select{width:100%;padding:12px;margin:6px 0 12px;border-radius:7px;border:1px solid #333;background:#090909;color:#fff}button{background:#e50914;border:0;color:#fff;padding:12px 16px;border-radius:7px;font-weight:bold;cursor:pointer}button.secondary{background:#222;border:1px solid #444}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.song{display:flex;gap:12px;align-items:center;border-top:1px solid #282828;padding:12px 0}.song>div{flex:1;min-width:0}.song input,.song select{margin:4px 0 6px}.small{color:#888;font-size:12px}.status{padding:10px;border-radius:7px;background:#151515;color:#bbb;margin:10px 0}.ok{color:#69e58b}.bad{color:#ff7373}.hidden{display:none}.logout{float:right;background:#222}.danger{background:#8d0008}@media(max-width:650px){.row{grid-template-columns:1fr}.song{align-items:flex-start;flex-direction:column}.song button{width:100%}}</style></head><body><div class="wrap"><button id="logout" class="logout hidden" onclick="logout()">Logout</button><div class="box"><div class="title">DJ DEEPAK MUSIC</div><h1>Admin Panel</h1><div id="status" class="status">Loading...</div></div>
<div id="loginBox" class="box"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="panel" class="hidden"><div class="box"><h2>🎵 Add Song</h2><input id="songTitle" placeholder="Song name"><input id="artist" placeholder="Artist / DJ Deepak" value="DJ Deepak"><select id="category"><option value="latest">Latest</option><option value="trending">Trending</option></select><label>MP3 file</label><input id="mp3" type="file" accept="audio/*"><label>Optional cover image</label><input id="cover" type="file" accept="image/*"><button onclick="addSong()">⬆ Upload & Add Song</button></div>
<div class="box"><h2>⚙️ Website Settings</h2><input id="siteTitle" placeholder="Site title"><input id="subtitle" placeholder="Subtitle"><input id="wa" placeholder="WhatsApp number e.g. 9098348310"><input id="insta" placeholder="Instagram e.g. @sr_deepak_777"><input id="siteEmail" placeholder="Email"><label>Banner image</label><input id="banner" type="file" accept="image/*"><button onclick="saveSettings()">💾 Save Settings</button></div>
<div class="box"><h2>📚 Songs</h2><div id="songs">Loading...</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const sb=(window.supabase&&SUPABASE_URL.startsWith('http'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;const $=id=>document.getElementById(id);function msg(t,ok=false){$('status').innerHTML=ok?'<span class="ok">✓ '+t+'</span>':'<span>'+t+'</span>'}function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)}async function init(){if(!sb){msg('supabase-config.js me URL aur key bharni hai.');return}const {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>show(s))}function show(session){$('loginBox').classList.toggle('hidden',!!session);$('panel').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);if(session){msg('Login successful',true);loadAll()}}async function login(){if(!sb)return;const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg(error.message);else msg('Login successful',true)}async function logout(){await sb.auth.signOut()}async function upload(file,path){const {error}=await sb.storage.from('dj-deepak').upload(path,file,{upsert:false,cacheControl:'3600'});if(error)throw error;return sb.storage.from('dj-deepak').getPublicUrl(path).data.publicUrl}
async function addSong(){let audioPath=null,coverPath=null;try{const file=$('mp3').files[0];const title=$('songTitle').value.trim();if(!file||!title)return msg('Song name aur MP3 dono select karo.');if(!/\.mp3$/i.test(file.name))return msg('Sirf .mp3 file upload karo.');msg('Uploading MP3...');audioPath='songs/'+Date.now()+'_'+slug(file.name)+'.mp3';const url=await upload(file,audioPath);let coverUrl=null;if($('cover').files[0]){const cf=$('cover').files[0];coverPath='covers/'+Date.now()+'_'+slug(cf.name);coverUrl=await upload(cf,coverPath)}const {error}=await sb.from('songs').insert({title,artist:$('artist').value.trim()||'DJ Deepak',category:$('category').value,storage_path:audioPath,audio_url:url,cover_url:coverUrl});if(error)throw error;$('songTitle').value='';$('mp3').value='';$('cover').value='';msg('Song upload ho gaya ✓',true);loadSongs()}catch(e){if(coverPath)await sb.storage.from('dj-deepak').remove([coverPath]).catch(()=>{});if(audioPath)await sb.storage.from('dj-deepak').remove([audioPath]).catch(()=>{});msg(e.message||'Upload failed')}}
async function saveSettings(){try{let bannerUrl=null;const f=$('banner').files[0];if(f)bannerUrl=await upload(f,'site/'+Date.now()+'_'+slug(f.name));const data={id:1,site_title:$('siteTitle').value.trim()||'DJ Deepak Music',subtitle:$('subtitle').value.trim()||'Feel The Beat • Live The Music',whatsapp:$('wa').value.trim(),instagram:$('insta').value.trim(),email:$('siteEmail').value.trim()};if(bannerUrl)data.banner_url=bannerUrl;const {error}=await sb.from('site_settings').upsert(data);if(error)throw error;msg('Website settings save ho gayi ✓',true)}catch(e){msg(e.message||'Save failed')}}
async function loadAll(){const {data}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();if(data){$('siteTitle').value=data.site_title||'';$('subtitle').value=data.subtitle||'';$('wa').value=data.whatsapp||'';$('insta').value=data.instagram||'';$('siteEmail').value=data.email||''}loadSongs()}async function loadSongs(){const {data,error}=await sb.from('songs').select('*').order('created_at',{ascending:false});if(error)return $('songs').innerHTML='<p class="bad">'+error.message+'</p>';$('songs').innerHTML=(data||[]).map(s=>`<div class="song"><div><input id="title-${s.id}" value="${safeAttr(s.title)}" placeholder="Song name"><input id="artist-${s.id}" value="${safeAttr(s.artist||'DJ Deepak')}" placeholder="Artist"><select id="cat-${s.id}"><option value="latest" ${s.category==='latest'?'selected':''}>Latest</option><option value="trending" ${s.category==='trending'?'selected':''}>Trending</option></select></div><button onclick="editSong('${s.id}')">Save</button><button class="danger" onclick="delSong('${s.id}','${safeAttr(s.storage_path)}','${safeAttr(s.cover_url||'')}')">Delete</button></div>`).join('')||'<p class="small">No songs yet.</p>'}function safe(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function safeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}async function editSong(id){try{const title=$('title-'+id).value.trim();const artist=$('artist-'+id).value.trim()||'DJ Deepak';const category=$('cat-'+id).value;if(!title)return msg('Song name empty nahi ho sakta.');const {error}=await sb.from('songs').update({title,artist,category}).eq('id',id);if(error)throw error;msg('Song details update ho gayi ✓',true);loadSongs()}catch(e){msg(e.message||'Update failed')}}async function delSong(id,path,coverUrl){if(!confirm('Is song ko delete karna hai?'))return;const files=[path];if(coverUrl){try{const u=new URL(coverUrl);const marker='/object/public/dj-deepak/';const i=u.pathname.indexOf(marker);if(i>=0)files.push(decodeURIComponent(u.pathname.slice(i+marker.length)))}catch(e){}}const {error:e1}=await sb.storage.from('dj-deepak').remove([path]);if(e1)return msg(e1.message);if(files.length>1)await sb.storage.from('dj-deepak').remove([files[1]]);const {error}=await sb.from('songs').delete().eq('id',id);if(error)return msg(error.message);msg('Song deleted ✓',true);loadSongs()}init();
</script></body></html>
